<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Trigo - sem conexao</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #111827;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 320px; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { font-size: 14px; color: #6b7280; margin: 0 0 20px; }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #2a4db3;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/logo-mark.png" alt="" width="64" height="64" />
      <h1>Sem conexao</h1>
      <p>Nao foi possivel falar com o servidor. Verifique a rede e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
